name: Build app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.MESSIFY_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache AOSP libraries
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Fetch AOSP libraries
        run: ./scripts/fetch-deps.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Messify-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A release APK signed with your own key is built only when the signing
      # secrets are set (Settings > Secrets and variables > Actions) and only
      # for pushes, since pull requests from forks cannot read secrets.
      - name: Build signed release APK
        if: github.event_name != 'pull_request' && env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MESSIFY_KEYSTORE_BASE64 }}
          MESSIFY_KEYSTORE_PASSWORD: ${{ secrets.MESSIFY_KEYSTORE_PASSWORD }}
          MESSIFY_KEY_ALIAS: ${{ secrets.MESSIFY_KEY_ALIAS }}
          MESSIFY_KEY_PASSWORD: ${{ secrets.MESSIFY_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/messify.jks"
          MESSIFY_KEYSTORE_FILE="$RUNNER_TEMP/messify.jks" ./gradlew assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/messify.jks"

      - name: Upload release APK
        if: github.event_name != 'pull_request' && env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Messify-release
          path: build/outputs/apk/release/*.apk
