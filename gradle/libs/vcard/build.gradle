// Build file for AOSP's vcard library; the sources are in third_party/vcard.

plugins {
    id 'com.android.library'
}

def src = rootProject.file('third_party/vcard')

android {
    namespace = 'com.android.vcard'
    compileSdk = 36

    defaultConfig {
        minSdk = 33
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ["$src/java", "stubs"]
            res.srcDirs = []
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}

dependencies {
}
